<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>DiceTray</title>
<link rel="icon" href="favicon.png" type="image/png">

<!-- Google Fonts: the app's only network dependency. Falls back to the
     generic families named in css/theme.css when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&family=IM+Fell+English:ital@0;1&family=Rajdhani:wght@400;500;600;700&family=Uncial+Antiqua&family=Share+Tech+Mono&family=Playfair+Display:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/tray.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/results.css">
</head>
<body>
<div id="bg-layer" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;transition:background-image 0.3s ease;"></div>
<div class="tray-root" style="position:relative;z-index:1;">
  <div class="tray-header">
    <h1 class="tray-title">Dice<span class="accent">Tray</span></h1>
    <div class="tray-controls">
      <button class="download-btn" id="download-btn" title="Save a single self-contained HTML file that works fully offline, with no download folder needed">Download offline copy</button>
      <div class="colour-scheme-wrapper">
        <span class="colour-scheme-label" aria-hidden="true">Customise Dice</span>
        <select class="colour-scheme-select" id="colour-scheme-select" aria-label="Customise dice colours">
          <!-- Options are built by main.js from COLOUR_SCHEMES (colour-schemes.js),
               reordered so the active tray's own schemes are listed first. -->
        </select>
      </div>
      <div class="colour-scheme-wrapper">
        <span class="colour-scheme-label" aria-hidden="true">Customise Tray</span>
        <select class="colour-scheme-select" id="tray-theme-select" aria-label="Customise tray theme">
          <option value="green-felt">Green Felt</option>
          <option value="ivory-marble">Ivory Marble</option>
          <option value="parchment">Ancient Parchment</option>
          <option value="midnight-velvet">Midnight Velvet</option>
          <option value="weathered-slate">Weathered Slate</option>
        </select>
      </div>
    </div>
  </div>

  <div class="picker" id="picker"></div>

  <div class="modifier-row">
    <label class="modifier-box" for="modifier-input">
      <span class="modifier-label">modifier</span>
      <button type="button" class="modifier-sign-btn" id="modifier-sign-btn" aria-label="Toggle modifier between positive and negative" tabindex="-1">&minus;/+</button>
      <input type="text" id="modifier-input" class="modifier-input" inputmode="numeric" autocomplete="off" value="+" aria-label="Modifier added to the total after rolling">
    </label>
    <button class="picker-clear" id="clear-btn">clear tray</button>
  </div>

  <div class="tray-surface">
    <div class="dice-field" id="dice-field"><canvas id="dice-canvas"></canvas><div class="tray-empty" id="tray-empty" style="display:none;">Tap a die above to add it to the tray. Up to 20 at once.</div></div>
    <div class="group-list" id="group-list"></div>
    <div class="roll-total" id="roll-total"><span class="total-number is-placeholder">&mdash;</span><span class="total-caption">total appears here after rolling</span></div>
  </div>

  <div class="count-label-row">
    <span class="tray-sub" id="count-label">1 / 20 in the Tray</span>
    <button class="roll-btn" id="roll-btn">Roll the tray</button>
  </div>
  <div class="adv-row">
    <button class="adv-btn" id="advantage-btn" title="Roll every die twice, keep the higher of each pair">Advantage</button>
    <button class="adv-btn disadv" id="disadvantage-btn" title="Roll every die twice, keep the lower of each pair">Disadvantage</button>
  </div>

  <div class="history" id="history" style="display:none;">
    <div class="history-title">Recent rolls</div>
    <div id="history-rows"></div>
  </div>

</div>

<!-- Classic scripts, loaded in dependency order. Everything below is plain
     <script src>, not modules, so this page keeps working when opened
     directly from disk (file://) with no server and no build step.
     js/main.js is loaded last — it's the only file that runs any code at
     load time; every other file just declares data/functions. -->
<script src="js/assets.js"></script>
<script src="js/dice-geometry.js"></script>
<script src="js/colour-schemes.js"></script>
<script src="js/math.js"></script>
<script src="js/die-model.js"></script>
<script src="js/state.js"></script>
<script src="js/layout.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/roll-animation.js"></script>
<script src="js/roll.js"></script>
<script src="js/modifier.js"></script>
<script src="js/interaction.js"></script>
<script src="js/tray-themes.js"></script>
<script src="js/preload.js"></script>
<script src="js/bundler.js"></script>
<script src="js/main.js"></script>
</body>
</html>
